[pytest]
# Configuração do Pytest para testes de fuzzing do crAPI

testpaths = tests
python_files = test_*.py fuzzing_*.py conftest.py
python_classes = Test*
python_functions = test_* fuzz_*

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = tests/fuzzing_results.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Marcadores customizados
markers =
    fuzzing: Marcados como testes de fuzzing
    generic: Testes genéricos de fuzzing
    workshop: Testes do serviço Workshop
    identity: Testes do serviço Identity
    community: Testes do serviço Community
    chatbot: Testes do serviço Chatbot
    slow: Testes lentos (podem demorar mais)
    critical: Testes de endpoints críticos
    injection: Testes de injeção (SQL, NoSQL, XSS, etc)
    authorization: Testes de autorização (BOLA, BFLA)
    authentication: Testes de autenticação
    llm_vulnerability: Testes de vulnerabilidades de LLM

# Timeout para testes
timeout = 30

# Captura de output
addopts = 
    --tb=short
    --strict-markers
    -v
    --capture=no
